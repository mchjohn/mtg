version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - echo "Installing dependencies..."
      - npm pkg delete scripts.prepare
      - npm ci

  pre_build:
    commands:
      - echo "Running quality checks..."
      - npm run lint:ci
      - npm run typecheck
      - echo "Running tests..."
      - npm run test:ci

  build:
    commands:
      - echo "Starting the application build..."
      - npm run build

  post_build:
    commands:
      - echo "Build completed successfully on $(date)"
      - aws s3 sync --delete ./dist s3://${DEPLOY_BUCKET}
      - aws cloudfront create-invalidation --distribution-id ${CF_ID} --paths /index.html

artifacts:
  files:
    - "**/*"
  base-directory: dist

cache:
  paths:
    - "node_modules/**/*"
